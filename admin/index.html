<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snaply Admin CRM — Trung tâm quản trị hệ sinh thái</title>
  <base href="/admin/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FF6550'/><text y='.9em' font-size='70' x='15' fill='white'>S</text></svg>">
  <link rel="stylesheet" href="/admin/styles.css?v=2.4">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ================= AUTH GATE ================= -->
  <div id="authGate" class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">S</div>
        <div>
          <div class="auth-title">Snaply Admin</div>
          <div style="font-size: 12px; color: var(--text-muted); font-weight: 500;">CRM & Ecosystem Portal</div>
        </div>
      </div>
      <p class="auth-subtitle">Đăng nhập tài khoản quản trị viên để truy cập bảng điều khiển.</p>

      <div id="authError" class="auth-error"></div>

      <form id="authForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Quản Trị</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="admin@snaply.app" value="nguyencongnguyen.media@gmail.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Mật khẩu</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••••••" value="Zxcvbnm123@" required autocomplete="current-password">
        </div>
        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
          Đăng Nhập Quản Trị Ngay
        </button>
      </form>
    </div>
  </div>

  <!-- ================= APP SHELL ================= -->
  <div id="appShell" class="app-shell" style="display: none;">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand-icon">S</div>
        <span class="sidebar-brand-name">Snaply Admin</span>
        <span class="sidebar-brand-badge">PROD</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Tổng quan</div>
        <button class="nav-item active" data-module="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>Dashboard</span>
        </button>

        <div class="nav-section-title">Người dùng & Nội dung</div>
        <button class="nav-item" data-module="users">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Người dùng</span>
        </button>
        <button class="nav-item" data-module="content">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>Khoảnh khắc</span>
        </button>
        <button class="nav-item" data-module="moderation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Kiểm duyệt</span>
          <span id="navModerationBadge" class="nav-item-badge" style="display: none;">0</span>
        </button>

        <div class="nav-section-title">Tăng trưởng & Hỗ trợ</div>
        <button class="nav-item" data-module="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Thống kê & Chỉ số</span>
        </button>
        <button class="nav-item" data-module="campaigns">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>Chiến dịch Push</span>
        </button>
        <button class="nav-item" data-module="support">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Ticket hỗ trợ</span>
          <span id="navSupportBadge" class="nav-item-badge" style="display: none;">0</span>
        </button>

        <div class="nav-section-title">Hệ thống & Vận hành</div>
        <button class="nav-item" data-module="health">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span>Trạng thái dịch vụ</span>
        </button>
        <button class="nav-item" data-module="releases">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span>Phiên bản App</span>
        </button>
        <button class="nav-item" data-module="feature-flags">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Feature Flags</span>
        </button>

        <div class="nav-section-title">Bảo mật & Quản trị</div>
        <button class="nav-item" data-module="rbac">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7z"/></svg>
          <span>Phân quyền Admin</span>
        </button>
        <button class="nav-item" data-module="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Audit Logs</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="admin-profile-pill">
          <div id="adminAvatar" class="admin-avatar">AD</div>
          <div class="admin-info">
            <div id="adminEmail" class="admin-name">Admin</div>
            <div id="adminRole" class="admin-role">Super Admin</div>
          </div>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Đăng xuất">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobileMenuBtn" class="mobile-toggle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="globalSearchInput" placeholder="Tìm kiếm tài khoản, ID khoảnh khắc, báo cáo...">
          </div>
        </div>

        <div class="topbar-right">
          <div class="env-pill">
            <div class="env-dot"></div>
            <span>Supabase Connected</span>
          </div>

          <button id="refreshDataBtn" class="icon-btn" title="Làm mới dữ liệu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>

          <button id="themeToggleBtn" class="icon-btn" title="Đổi giao diện Sáng / Tối">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </header>

      <main class="content-body" id="mainContent">
        <!-- Rendered dynamically by app.js -->
      </main>
    </div>
  </div>

  <!-- ================= MODALS ================= -->
  <!-- User Action Modal -->
  <div id="userModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="userModalTitle" class="modal-title">Chi tiết Người dùng</h3>
        <button class="icon-btn close-modal-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="userModalBody" class="modal-body"></div>
      <div class="modal-footer" id="userModalFooter"></div>
    </div>
  </div>

  <!-- Generic Action Modal -->
  <div id="actionModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="actionModalTitle" class="modal-title">Xác nhận</h3>
        <button class="icon-btn close-modal-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="actionModalBody" class="modal-body"></div>
      <div class="modal-footer" id="actionModalFooter"></div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- APP SCRIPT (cache-busting v=2.4 & absolute path) -->
  <script src="/admin/app.js?v=2.4"></script>
</body>
</html>
